<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sloth Bear | Forest Beings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // add text-xxs
      tailwind.config = {
        theme: {
          extend: {
            fontSize: {
              xxs: "0.625rem",
            },
            colors: {
              earth: {
                dark: "#5D5852",
                mid: "#7D7772",
                light: "#F1EFEB",
                accent: "#B7B2A9",
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap");

      * {
        font-family: "Cormorant Garamond", serif;
      }

      /* Only keeping minimal CSS that's challenging to do with Tailwind */

      .india-map {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M30,20 C25,30 20,40 25,45 C30,50 25,60 30,70 C35,80 45,85 50,80 C55,75 65,80 70,75 C75,70 80,60 75,55 C70,50 80,45 75,40 C70,35 65,25 60,20 C55,15 45,10 40,15 C35,20 35,10 30,20 Z" fill="%23B7B2A9" stroke="white" stroke-width="1"/></svg>');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        position: relative;
      }

      .region-highlight {
        position: absolute;
        background-color: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      /* Central India highlight */
      .region-central {
        top: 40%;
        left: 20%;
        width: 60%;
        height: 30%;
      }
    </style>
  </head>
  <body
    class="bg-stone-200 flex justify-center items-center min-h-screen mx-auto"
  >
    <div class="grid grid-cols-1 gap-8">
      <!-- Sloth Bear Card -->
      <div class="max-w-[22rem] rounded-xl overflow-hidden shadow-lg">
        <!-- Main content area -->
        <div class="bg-earth-dark text-earth-light">
          <!-- Top section with name and basic info -->
          <div class="flex">
            <!-- Left column with stats -->
            <div class="p-3 w-2/5 border-r border-earth-mid/30">
              <div>
                <div class="text-xl font-medium">Sloth Bear</div>
                <div
                  class="italic text-white/60 border-b border-earth-accent/30 pb-1"
                >
                  Melursus ursinus
                </div>
              </div>
              <div class="space-y-2 mt-2">
                <div>
                  <div class="text-2xl font-bold">40 years</div>
                  <div class="text-xxs text-stone-400">
                    Life span in the wild
                  </div>
                </div>

                <div>
                  <div class="text-xl font-bold">
                    140-170
                    <span class="font-light text-stone-400">cm</span>
                  </div>
                  <div class="text-xxs text-stone-400">Height</div>
                </div>

                <div>
                  <div class="text-xl font-bold">
                    55-145
                    <span class="font-light text-stone-400">kg</span>
                  </div>
                  <div class="text-xs text-stone-400">Weight</div>
                </div>

                <!-- Geographic context -->

                <div class="bg-earth-mid/60 object-cover">
                  <div class="text-sm">Geographic range Placeholder</div>
                </div>
              </div>
            </div>

            <!-- Right side with image -->
            <div class="w-3/5">
              <!-- Image of sloth bear -->
              <div class="h-48 overflow-hidden">
                <img
                  src="/images/sloth-bear.webp"
                  alt="Sloth Bear"
                  class="w-full h-full object-cover"
                />
              </div>
              <div class="p-3 border-t border-earth-mid/30">
                <div class="">
                  <div class="text-sm">Vulnerable</div>
                  <div data-status="vu" class="space-x-1 flex text-xxs">
                    <div
                      class="data-[active=true]:bg-black data-[active=true]:text-red-600 w-5 h-5 border border-black data-[active=true]:font-semibold rounded-full flex items-center justify-center"
                      data-status-value="ex"
                    >
                      EX
                    </div>
                    <div
                      class="data-[active=true]:bg-black data-[active=true]:text-white w-5 h-5 border border-black data-[active=true]:font-semibold rounded-full flex items-center justify-center"
                      data-status-value="ew"
                    >
                      EW
                    </div>
                    <div
                      class="data-[active=true]:bg-red-600 data-[active=true]:text-red-200 w-5 h-5 border border-red-600 data-[active=true]:font-semibold rounded-full flex items-center justify-center"
                      data-status-value="cr"
                    >
                      CR
                    </div>
                    <div
                      class="data-[active=true]:bg-amber-600 data-[active=true]:text-orange-200 w-5 h-5 border border-amber-600 data-[active=true]:font-semibold rounded-full flex items-center justify-center"
                      data-status-value="en"
                    >
                      EN
                    </div>
                    <div
                      class="data-[active=true]:bg-yellow-600 data-[active=true]:text-yellow-100 w-5 h-5 border border-yellow-600 data-[active=true]:font-semibold rounded-full flex items-center justify-center"
                      data-status-value="vu"
                      data-active="true"
                    >
                      VU
                    </div>
                    <div
                      class="data-[active=true]:bg-teal-800 data-[active=true]:text-green-200 w-5 h-5 border border-teal-800 data-[active=true]:font-semibold rounded-full flex items-center justify-center"
                      data-status-value="nt"
                    >
                      NT
                    </div>
                    <div
                      class="data-[active=true]:bg-green-800 data-[active=true]:text-white w-5 h-5 border border-green-800 data-[active=true]:font-semibold rounded-full flex items-center justify-center"
                      data-status-value="lc"
                    >
                      LC
                    </div>
                  </div>
                  <div class="text-xs text-stone-400">IUCN Status</div>
                </div>

                <div class="">
                  <div class="text-xl font-bold">6,000-10,000</div>
                  <div class="text-xs text-stone-400">Population</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom section with IUCN and population -->
        </div>

        <!-- Distinguishing feature -->
        <div class="p-4 bg-earth-light text-earth-dark">
          <div class="flex gap-3">
            <div>
              <div class="text-lg font-bold">Unpredictable</div>
              <div
                class="bg-white p-1 rounded-full flex items-center justify-center space-x-1 my-1"
              >
                <div
                  class="w-2 h-2 rounded-full bg-red-500 border border-earth-dark/50"
                ></div>
                <div
                  class="w-2 h-2 rounded-full bg-red-500 border border-earth-dark/50"
                ></div>
                <div
                  class="w-2 h-2 rounded-full bg-red-500 border border-earth-dark/50"
                ></div>
                <div
                  class="w-2 h-2 rounded-full bg-red-500 border border-earth-dark/50"
                ></div>
                <div
                  class="w-2 h-2 rounded-full bg-red-500 border border-earth-dark/50"
                ></div>
              </div>
            </div>
            <div class="text-xs font-medium text-stone-900">
              Most aggressive of Indian bears. Can charge without provocation.
              Maintain maximum distance.
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
