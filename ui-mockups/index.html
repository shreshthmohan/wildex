<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Species Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "media",
        theme: {
          extend: {
            fontFamily: {
              serif: ["Crimson Text", "Georgia", "serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Crimson Text", Georgia, serif;
      }

      /* Card hover effect */
      .species-card {
        transition: transform 0.2s ease-in-out;
      }

      .species-card:hover {
        transform: translateY(-4px);
      }

      /* Image container aspect ratio */
      .card-image-container {
        aspect-ratio: 4/3;
        overflow: hidden;
      }

      .card-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Search input styling */
      .search-input:focus {
        outline: none;
        box-shadow: 0 0 0 2px black;
      }

      .dark .search-input:focus {
        box-shadow: 0 0 0 2px white;
      }
    </style>
  </head>
  <body class="bg-white text-black dark:bg-black dark:text-white">
    <div class="max-w-screen-xl mx-auto p-4 md:p-8">
      <!-- Header -->
      <header class="mb-12">
        <h1 class="text-5xl md:text-6xl font-bold mb-6">Species Collection</h1>
        <div class="max-w-2xl">
          <input
            type="text"
            id="search"
            placeholder="Search by scientific name, authority, or common name..."
            class="search-input w-full px-4 py-3 text-xl border-2 border-black dark:border-white bg-white dark:bg-black text-black dark:text-white"
            aria-label="Search species"
          />
        </div>
        <p class="mt-4 text-xl" id="count-display">Loading species...</p>
      </header>

      <!-- Species Grid -->
      <div
        id="species-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      >
        <!-- Cards will be populated by JavaScript -->
      </div>

      <!-- No results message -->
      <div id="no-results" class="hidden text-center py-20">
        <p class="text-3xl font-bold mb-4">No species found</p>
        <p class="text-xl">Try a different search term</p>
      </div>
    </div>

    <script>
      const DATA_PATH = "../spider/species_list.json";
      let allSpecies = [];
      let filteredSpecies = [];

      // Load species data
      async function loadSpecies() {
        try {
          const response = await fetch(DATA_PATH);
          allSpecies = await response.json();
          filteredSpecies = [...allSpecies];
          renderSpecies(filteredSpecies);
          updateCount();
        } catch (error) {
          document.getElementById("species-grid").innerHTML = `
            <div class="col-span-full p-8 border-2 border-black dark:border-white">
              <h2 class="text-2xl font-bold mb-4">Error Loading Species Data</h2>
              <p class="text-lg">Could not load species data. Please check the file path.</p>
              <p class="text-sm mt-2 font-mono">${error.message}</p>
            </div>
          `;
        }
      }

      // Render species cards
      function renderSpecies(species) {
        const grid = document.getElementById("species-grid");
        const noResults = document.getElementById("no-results");

        if (species.length === 0) {
          grid.innerHTML = "";
          noResults.classList.remove("hidden");
          return;
        }

        noResults.classList.add("hidden");

        grid.innerHTML = species
          .map((sp) => {
              let speciesId = '';
              try {
                const url = new URL(sp.species_url);
                speciesId = url.searchParams.get('id') || '';
              } catch (e) {
                console.error('Invalid URL:', sp.species_url);
              }

              return `
          <a
            href="species.html?id=${speciesId}"
            class="species-card block border-2 border-black dark:border-white bg-white dark:bg-black hover:bg-gray-50 dark:hover:bg-gray-900"
          >
            ${
              sp.thumbnail_url
                ? `
              <div class="card-image-container border-b-2 border-black dark:border-white">
                <img
                  src="${sp.thumbnail_url}"
                  alt="${sp.scientific_name}"
                  loading="lazy"
                />
              </div>
            `
                : ""
            }
            <div class="p-4">
              <h2 class="text-2xl font-bold italic mb-2">${sp.scientific_name}</h2>
              ${sp.authority ? `<p class="text-lg mb-3">${sp.authority}</p>` : ""}
              ${
                sp.common_names && sp.common_names.length > 0
                  ? `<p class="text-base">${sp.common_names.join(", ")}</p>`
                  : ""
              }
            </div>
          </a>
        `;
          })
          .join("");
      }

      // Update count display
      function updateCount() {
        const countDisplay = document.getElementById("count-display");
        const total = allSpecies.length;
        const shown = filteredSpecies.length;

        if (shown === total) {
          countDisplay.textContent = `Showing all ${total} species`;
        } else {
          countDisplay.textContent = `Showing ${shown} of ${total} species`;
        }
      }

      // Search functionality
      function searchSpecies(query) {
        const searchTerm = query.toLowerCase().trim();

        if (!searchTerm) {
          filteredSpecies = [...allSpecies];
        } else {
          filteredSpecies = allSpecies.filter((sp) => {
            const scientificMatch = sp.scientific_name
              .toLowerCase()
              .includes(searchTerm);
            const authorityMatch = sp.authority
              ?.toLowerCase()
              .includes(searchTerm);
            const commonMatch = sp.common_names?.some((name) =>
              name.toLowerCase().includes(searchTerm),
            );

            return scientificMatch || authorityMatch || commonMatch;
          });
        }

        renderSpecies(filteredSpecies);
        updateCount();
      }

      // Debounce search input
      let searchTimeout;
      document.getElementById("search").addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          searchSpecies(e.target.value);
        }, 300);
      });

      // Load species on page load
      loadSpecies();
    </script>
  </body>
</html>
